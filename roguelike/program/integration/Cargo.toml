[package]
name = "dungeon-arena-integration"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the compiled dungeon-arena program in LiteSVM. Build it first with cargo build-sbf."

[dependencies]

[dev-dependencies]
anchor-lang = "1.2.0"
dungeon-arena = { path = "../programs/dungeon-arena", features = ["no-entrypoint"] }
litesvm = "0.16"
litesvm-token = "0.16"
sha2 = "0.10"
solana-address = "2.6"
solana-clock = "3.1"
solana-hash = "4.5"
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3"
solana-slot-hashes = "3.1"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
